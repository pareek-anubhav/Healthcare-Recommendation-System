<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction History — MediScan AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

<div class="navbar">
    <h2>Your Prediction History</h2>
    <div>
        <a href="{{ url_for('prediction.home') }}">⬅ Predict Again</a>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>
</div>

<table>
    <tr>
        <th>Date</th>
        <th>Disease</th>
        <th>Confidence</th>
        <th>Symptoms</th>
        <th>Report</th>
    </tr>

    {% for item in history %}
    <tr>
        <td>{{ item.prediction_date }}</td>
        <td>{{ item.predicted_disease }}</td>
        <td>{{ item.confidence }}%</td>
        <td>{{ item.symptoms }}</td>
        <td><a class="btn" href="{{ url_for('reports.download_report', history_id=item.id) }}">⬇ Download</a></td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
