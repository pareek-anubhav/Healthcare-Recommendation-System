<!DOCTYPE html>
<html>
<head>
    <title>Add Doctor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

<div class="navbar">
    <h2>Add Doctor</h2>
    <div>
        <a href="{{ url_for('admin.dashboard') }}">⬅ Dashboard</a>
        <a href="{{ url_for('admin.logout') }}">Logout</a>
    </div>
</div>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
{% endwith %}

<form method="POST" style="background:white; padding:24px; border-radius:8px; max-width:400px;">

    <label>Full Name</label><br>
    <input type="text" name="name" required style="width:100%; padding:8px; margin:6px 0 16px;"><br>

    <label>Email</label><br>
    <input type="email" name="email" required style="width:100%; padding:8px; margin:6px 0 16px;"><br>

    <label>Password</label><br>
    <input type="password" name="password" required style="width:100%; padding:8px; margin:6px 0 16px;"><br>

    <button type="submit" class="btn">Add Doctor</button>

</form>

</body>
</html>
